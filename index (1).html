in:18px 0 8px}.round{border-radius:50%;width:174px;height:174px;margin:24px auto 8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:20px;box-shadow:0 8px 30px #24674720}.round svg{width:32px;height:32px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.row>*{min-width:0}.actions{display:flex;gap:10px;margin-top:20px}.actions>*{flex:1}.stack{display:grid;gap:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stat{border-top:1px solid var(--line);padding-top:14px}.stat strong{display:block;font-size:23px;font-variant-numeric:tabular-nums}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;background:var(--soft);color:var(--green);font-size:12px;font-weight:650}.badge.pending{color:var(--gold);background:transparent;border:1px solid var(--line)}.badge.mezza{color:var(--gold)}.badge.intera{color:var(--purple)}.turn{width:100%;text-align:left;display:block;margin-bottom:10px;padding:17px;border-radius:18px}.turn .row{align-items:flex-start}.turn strong{font-size:17px}.turn .meta{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}.turn small{display:block;margin-top:3px}.turn svg{width:16px;height:16px}.iconbtn{margin-left:auto;width:48px;height:48px;padding:0;border-radius:15px;display:grid;place-items:center;flex:none}.iconbtn[aria-current=page]{background:var(--soft);color:var(--green);border-color:var(--green)}.calendar button.planned{background:var(--green);color:var(--card);font-weight:750}.calendar .dot{box-shadow:0 0 0 1.5px var(--card)}.sw{width:12px;height:12px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:4px}.sw.plan{background:var(--green)}.sw.done{background:var(--soft);border:1px solid var(--line)}.dayhead-row{margin:8px 0 12px}.dayhead-row h2{margin:0}.dayhead-row button{min-height:44px;padding:8px 14px}.worknote{font-size:14px;margin:0 0 12px}.next{margin-bottom:16px}.next .eyebrow{margin-bottom:4px}.turn .notepreview{margin-top:6px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.turn .row>div:first-child{flex:1;min-width:0}.empty{text-align:center;color:var(--muted);padding:28px 8px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.calendar .dayhead{font-size:12px;padding:10px 0;color:var(--muted)}.calendar button{position:relative;padding:6px 0 15px;min-height:49px;border-radius:12px;border-color:transparent;background:none;font-weight:500}.calendar button.worked{background:var(--soft);font-weight:750}.calendar button.selected{outline:2px solid var(--green);outline-offset:-2px}.calendar button.today{border-color:var(--green)}.dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:4px}.dot{width:5px;height:5px;border-radius:50%;display:inline-block;background:var(--gold)}.dot.full{background:var(--purple)}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:15px;font-size:12px;color:var(--muted)}.monthbar{margin-bottom:15px}.monthbar h2{text-transform:capitalize;margin:0;text-align:center;font-size:18px}.monthbar button{padding:10px;min-width:46px}.segments{display:flex;gap:8px;margin:18px 0}.segments button{flex:1;padding:10px}.segments button[aria-pressed=true]{background:var(--soft);border-color:var(--green);color:var(--green)}label{display:block;font-size:14px;font-weight:650;margin-bottom:15px}input,select,textarea{display:block;width:100%;max-width:100%;min-height:50px;margin-top:7px;padding:11px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:var(--bg);font-size:16px}textarea{resize:vertical;min-height:86px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}nav button{flex:1;max-width:145px;min-width:0;border:0;background:none;border-radius:12px;padding:7px 2px;color:var(--muted);font-size:12px;display:flex;align-items:center;flex-direction:column;gap:3px}nav button[aria-current=page]{background:var(--soft);color:var(--green)}dialog{border:1px solid var(--line);background:var(--card);color:var(--text);padding:24px;width:calc(100% - 24px);max-width:460px;border-radius:24px;box-shadow:var(--shadow)}dialog::backdrop{background:#0c201b88}dialog.sheet{margin:auto auto 0;width:100%;max-width:600px;max-height:93dvh;border-radius:26px 26px 0 0;padding:12px 22px max(24px,env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain}.handle{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 20px}.sheet .heading{margin-bottom:18px}.sheet h2{margin:0}.sheet .close{font-size:24px;padding:0;min-width:44px;min-height:44px}.error{color:var(--danger);font-size:14px}.notice{border:1px solid var(--line);padding:14px;border-radius:16px;margin:12px 0 20px;font-size:14px;background:var(--soft)}#toast{position:fixed;z-index:50;bottom:calc(100px + env(safe-area-inset-bottom));left:16px;right:16px;margin:auto;max-width:550px;border-radius:16px;padding:14px 18px;background:var(--text);color:var(--bg);box-shadow:var(--shadow)}[hidden]{display:none!important}body:has(dialog[open]){overflow:hidden}.netbox{padding:14px 18px;background:var(--soft);border-radius:15px;margin-bottom:20px}.netbox strong{font-size:25px;font-variant-numeric:tabular-nums}#storageError{max-width:560px;margin:0 auto 16px;padding:14px;border:2px solid var(--danger);border-radius:14px}footer{font-size:12px;color:var(--muted);text-align:center;padding:10px} @media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .15s}button:active{transform:scale(.98)}}

<body>
<header><div class="mark" id="brandIcon"></div><div><strong>Le mie ore</strong><small>Turni al golf club</small></div><button type="button" class="iconbtn" id="settingsBtn" data-page="settings" aria-label="Impostazioni"></button></header>
<div id="storageError" role="alert" hidden></div>
<main id="main"></main>
<nav aria-label="Navigazione principale"></nav>
<div id="toast" role="status" hidden></div>
<dialog id="editor" class="sheet" aria-labelledby="editorTitle">
 <div class="handle"></div><div class="row heading"><h2 id="editorTitle">Riepilogo turno</h2><button type="button" class="close" id="closeEditor" aria-label="Chiudi riepilogo">×</button></div>
 <form id="shiftForm">
 <label>Data di inizio<input id="date" type="date" required></label>
 <div class="fieldrow"><label>Inizio<input id="start" type="time" required step="1"></label><label>Fine<input id="end" type="time" required step="1"></label></div>
 <label>Data di fine<input id="endDate" type="date" required></label>
 <p id="overnight" class="muted" hidden>Il turno termina in una data successiva e resta nel giorno di inizio.</p>
 <label>Pausa totale (minuti)<input id="break" type="number" min="0" step="any" required inputmode="decimal"></label>
 <div class="netbox row"><span>Ore nette</span><strong id="netPreview">—</strong></div>
 <label>Gara<select id="race"><option value="nessuna">Nessuna</option><option value="mezza">Mezza giornata</option><option value="intera">Giornata intera</option></select></label>
 <label>Compenso (€) · facoltativo<input id="pay" type="text" inputmode="decimal" placeholder="Da definire" maxlength="16"></label>
 <label>Note<textarea id="notes" placeholder="Qualcosa da ricordare…" maxlength="10000"></textarea></label>
 <p id="formError" class="error" role="alert"></p>
 <div class="stack"><button type="submit" class="primary">Salva turno</button><button type="button" id="deleteShift" class="danger">Annulla turno</button></div>
 </form>
</dialog>
<dialog id="planner" class="sheet" aria-labelledby="plannerTitle">
 <div class="handle"></div><div class="row heading"><h2 id="plannerTitle">Turno previsto</h2><button type="button" class="close" id="closePlanner" aria-label="Chiudi">×</button></div>
 <form id="planForm">
 <label>Data<input id="pDate" type="date" required></label>
 <div class="fieldrow"><label>Inizio<input id="pStart" type="time" required></label><label>Fine<input id="pEnd" type="time" required></label></div>
 <div class="netbox row"><span>Ore previste</span><strong id="pPreview">—</strong></div>
 <label>Gara<select id="pRace"><option value="nessuna">Nessuna</option><option value="mezza">Mezza giornata</option><option value="intera">Giornata intera</option></select></label>
 <label>Note<textarea id="pNotes" placeholder="Es. portare la divisa" maxlength="2000"></textarea></label>
 <p id="pError" class="error" role="alert"></p>
 <div class="stack"><button type="submit" class="primary">Salva nel calendario</button><button type="button" id="deletePlan" class="danger">Elimina</button></div>
 </form>
</dialog>
<dialog id="confirmation" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="actions"><button id="confirmNo">Indietro</button><button id="confirmYes" class="danger">Conferma</button></div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='golf-ore-v1', MIN=60000;
const paths={flag:'M6 21V3l14 5-14 5M3 21h13',today:'M12 8v4l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',calendar:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2',history:'M4 5h16M4 12h16M4 19h10',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',play:'m9 5 10 7-10 7Z',pause:'M8 5v14M16 5v14',note:'M5 3h14v18H5ZM8 7h8M8 11h8M8 15h4',left:'m15 5-7 7 7 7',right:'m9 5 7 7-7 7',download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4'};
function icon(name){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[name]+'"/></svg>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pad=n=>String(n).padStart(2,'0');
function dateKey(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const monthKey=d=>dateKey(d).slice(0,7), localDate=s=>new Date(s+'T12:00:00');
const dateIT=s=>localDate(s).toLocaleDateString('it-IT'), clock=s=>new Date(s).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const timeInput=s=>{const d=new Date(s);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const euros=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'}), hours=n=>{const t=Math.round(Math.max(0,n)/MIN),h=Math.floor(t/60),m=t%60;return h&&m?h+' h '+m+' min':h?h+' h':m+' min'};
function duration(ms){const s=Math.floor(Math.max(0,ms)/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function breakMs(s,now=Date.now()){return s.pausaManualeMinuti!==null?s.pausaManualeMinuti*MIN:s.pause.reduce((n,p)=>n+Math.max(0,Date.parse(p.fine||s.fine||new Date(now).toISOString())-Date.parse(p.inizio)),0)}
const netMs=(s,now=Date.now())=>Math.max(0,Date.parse(s.fine||new Date(now).toISOString())-Date.parse(s.inizio)-breakMs(s,now));
function emptyState(){return {version:1,turni:[],programmati:[],attivo:null,esempiInizializzati:true}}
const raceLabel={nessuna:'Nessuna',mezza:'Mezza giornata',intera:'Giornata intera'};
let state=emptyState(), raw=null, locked=false, memoryOnly=false, page='today', selectedDay=dateKey(), calMonth=monthKey(new Date()), histMonth=calMonth, filter='all', editing=null, returnFocus=null;
function message(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(message.timer);message.timer=setTimeout(()=>$('toast').hidden=true,5000)}
function storageFailure(t){$('storageError').textContent=t;$('storageError').hidden=false}
function checkShift(s,active=false){
 if(!s||typeof s.id!=='string'||!s.id||!/^\d{4}-\d{2}-\d{2}$/.test(s.data)||!Number.isFinite(Date.parse(s.inizio))||typeof s.inizio!=='string')throw Error('Turno non valido.');
 if(dateKey(localDate(s.data))!==s.data||dateKey(new Date(s.inizio))!==s.data)throw Error('Data del turno non valida per il fuso orario di questo dispositivo.');
 if((!active||s.fine!==null)&&(!Number.isFinite(Date.parse(s.fine))||typeof s.fine!=='string'||Date.parse(s.fine)<=Date.parse(s.inizio)))throw Error('Orari del turno non validi.');
 if(!Array.isArray(s.pause)||!Object.hasOwn(raceLabel,s.gara)||typeof s.note!=='string'||s.note.length>10000||!(s.compenso===null||(typeof s.compenso==='number'&&Number.isFinite(s.compenso)&&s.compenso>=0))||!(s.pausaManualeMinuti===null||(typeof s.pausaManualeMinuti==='number'&&Number.isFinite(s.pausaManualeMinuti)&&s.pausaManualeMinuti>=0)))throw Error('Campi del turno non validi.');
 let last=Date.parse(s.inizio);s.pause.forEach((p,i)=>{if(!p||typeof p.inizio!=='string'||!Number.isFinite(Date.parse(p.inizio))||Date.parse(p.inizio)<last)throw Error('Pause non valide.');if(p.fine===null){if(!active||s.fine!==null||i!==s.pause.length-1)throw Error('Pausa aperta non valida.');last=Date.parse(p.inizio)}else{if(typeof p.fine!=='string'||!Number.isFinite(Date.parse(p.fine))||Date.parse(p.fine)<Date.parse(p.inizio))throw Error('Pausa non valida.');last=Date.parse(p.fine)}if(s.fine&&last>Date.parse(s.fine))throw Error('Pausa oltre la fine del turno.');});
 if(s.fine&&breakMs(s)>Date.parse(s.fine)-Date.parse(s.inizio))throw Error('La pausa supera la durata del turno.');
 return {id:s.id,data:s.data,inizio:s.inizio,fine:s.fine,pause:s.pause.map(p=>({inizio:p.inizio,fine:p.fine})),pausaManualeMinuti:s.pausaManualeMinuti,gara:s.gara,compenso:s.compenso,note:s.note,esempio:s.esempio===true};
}
const toMin=t=>Number(t.slice(0,2))*60+Number(t.slice(3,5));
function planMs(p){let a=toMin(p.inizio),b=toMin(p.fine);if(b<=a)b+=1440;return (b-a)*MIN}
function checkPlan(p){if(!p||typeof p.id!=='string'||!p.id||!/^\d{4}-\d{2}-\d{2}$/.test(p.data)||!/^\d{2}:\d{2}$/.test(p.inizio)||!/^\d{2}:\d{2}$/.test(p.fine)||!Object.hasOwn(raceLabel,p.gara)||typeof p.note!=='string'||p.note.length>2000)throw Error('Turno previsto non valido.');return {id:p.id,data:p.data,inizio:p.inizio,fine:p.fine,gara:p.gara,note:p.note,esempio:p.esempio===true}}
function validate(x){if(!x||x.version!==1||!Array.isArray(x.turni)||x.turni.length>100000)throw Error('Backup non riconosciuto (versione 1 richiesta).');const turni=x.turni.map(s=>checkShift(s)),attivo=x.attivo===null?null:checkShift(x.attivo,true),ids=turni.map(s=>s.id);if(attivo)ids.push(attivo.id);if(new Set(ids).size!==ids.length)throw Error('Identificativi duplicati.');const programmati=(x.programmati??[]);if(!Array.isArray(programmati))throw Error('Calendario non valido.');return {version:1,turni,programmati:programmati.map(checkPlan),attivo,esempiInizializzati:true}}
function commit(next,opts){const ok=commitLocal(next,opts);if(ok)markDirty();return ok}
function commitLocal(next,{recover=false}={}){
 if(memoryOnly){state=next;locked=false;return true}
 if(locked&&!recover){message('Archivio non leggibile: esporta una copia e importa un backup valido da Impostazioni.');return false}
 try{const latest=localStorage.getItem(KEY);if(latest!==raw){sync();message('Archivio aggiornato da un’altra finestra. Riprova.');return false}const nextRaw=JSON.stringify(next);localStorage.setItem(KEY,nextRaw);state=next;raw=nextRaw;locked=false;$('storageError').hidden=true;return true}catch(e){storageFailure('Salvataggio non riuscito. Controlla lo spazio e consenti l’archiviazione nel browser. I dati precedenti sono conservati.');return false}
}
function examples(){return [3,2,1].map((ago,i)=>{let d=new Date();d.setDate(d.getDate()-ago);let data=dateKey(d);return {id:uid(),data,inizio:new Date(data+'T09:00:00').toISOString(),fine:new Date(data+'T'+['13:30','16:00','14:00'][i]+':00').toISOString(),pause:[],pausaManualeMinuti:[15,30,0][i],gara:['nessuna','intera','mezza'][i],compenso:[null,70,52.5][i],note:'ESEMPIO · turno dimostrativo',esempio:true}})}
function storageAvailable(){try{const k=KEY+'-test';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}}
function planExamples(){return [[2,'08:30','14:00','nessuna'],[5,'07:30','17:00','intera']].map(([ahead,a,b,g])=>{let d=new Date();d.setDate(d.getDate()+ahead);return {id:uid(),data:dateKey(d),inizio:a,fine:b,gara:g,note:'ESEMPIO · turno previsto',esempio:true}})}
function load(){if(!storageAvailable()){memoryOnly=true;state=emptyState();storageFailure('Qui i dati non possono essere salvati e si perdono alla chiusura. Apri l’app dal suo link nel browser (o dall’icona sulla schermata Home) per usarla davvero.');return}try{raw=localStorage.getItem(KEY);if(raw===null){commit(emptyState())}else state=validate(JSON.parse(raw))}catch(e){locked=true;storageFailure('Archivio non leggibile: non è stato sovrascritto. Da Impostazioni puoi scaricarne una copia o importare un backup valido.')}}
function sync(){if(memoryOnly)return;try{const v=localStorage.getItem(KEY);if(v===raw)return;raw=v;state=v===null?emptyState():validate(JSON.parse(v));locked=false;$('storageError').hidden=true;if($('confirmation').open)$('confirmation').close();if($('editor').open)$('editor').close();if($('planner').open)$('planner').close();render()}catch(e){locked=true;storageFailure('Archivio aggiornato ma non leggibile. Ripristina un backup da Impostazioni.')}}

const garaCode=Object.fromEntries(Object.entries(raceLabel).map(([k,v])=>[v,k]));
const r2=n=>Math.round(n*100)/100;
function rowsTurni(){return state.turni.slice().sort((a,b)=>Date.parse(a.inizio)-Date.parse(b.inizio)).map(s=>[s.id,dateIT(s.data),localDate(s.data).toLocaleDateString('it-IT',{weekday:'long'}),clock(s.inizio),clock(s.fine),r2(breakMs(s)/MIN),r2(netMs(s)/3600000),raceLabel[s.gara],s.compenso===null?'':s.compenso,s.note,s.data,s.inizio,s.fine])}
function rowsPrevisti(){return sortedPlans(state.programmati).map(p=>[p.id,dateIT(p.data),weekday(p.data),p.inizio,p.fine,r2(planMs(p)/3600000),raceLabel[p.gara],p.note,p.data])}
async function cloudFetch(body){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);try{const r=body?await fetch(meta.url,{method:'POST',body:JSON.stringify({codice:meta.codice,...body}),signal:ctl.signal}):await fetch(meta.url+(meta.url.includes('?')?'&':'?')+'codice='+encodeURIComponent(meta.codice),{signal:ctl.signal});const j=await r.json();if(!j||typeof j!=='object')throw Error('bad');return j}catch(e){throw Error(navigator.onLine?'Google Sheets non risponde: controlla indirizzo dello script e pubblicazione.':'Nessuna connessione: copio appena torna la rete.')}finally{clearTimeout(t)}}
async function pushCloud(force=false,manual=false){if(!cloudOn())return;if(syncing){clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushCloud(force,manual),2000);return}if(!navigator.onLine){meta.errore='Nessuna connessione: copio appena torna la rete.';saveMeta();updateSyncUI();return}syncing=true;const seq=changeSeq;try{const res=await cloudFetch({azione:'salva',forza:force,turni:rowsTurni(),previsti:rowsPrevisti()});if(res.ok){meta.ultimaSync=new Date().toISOString();meta.errore='';meta.bloccato=null;meta.inAttesa=seq!==changeSeq;if(manual)message('Copia su Google Sheets aggiornata.')}else if(res.codice==='riduzione'){meta.bloccato={foglio:res.esistenti,qui:state.turni.length};meta.errore='';if(manual||page==='settings')render()}else{meta.errore=res.errore||'Errore da Google Sheets.'}}catch(e){meta.errore=e.message}finally{syncing=false;saveMeta();updateSyncUI();if(meta.inAttesa&&!meta.bloccato&&!meta.errore){clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushCloud(),1500)}}}
function parseRemote(res){let skipped=0;const turni=[],programmati=[];for(const r of res.turni||[]){try{turni.push(checkShift({id:String(r[0]),data:String(r[10]),inizio:String(r[11]),fine:String(r[12]),pause:[],pausaManualeMinuti:Number(r[5])||0,gara:garaCode[r[7]]||'nessuna',compenso:r[8]===''||r[8]===null?null:Number(r[8]),note:String(r[9]??'')}))}catch(e){skipped++}}for(const r of res.previsti||[]){try{programmati.push(checkPlan({id:String(r[0]),data:String(r[8]),inizio:String(r[3]),fine:String(r[4]),gara:garaCode[r[6]]||'nessuna',note:String(r[7]??'')}))}catch(e){skipped++}}return {turni,programmati,skipped}}
async function cloudRestore(){if(!cloudOn())return;let res;try{res=await cloudFetch()}catch(e){message(e.message);return}if(!res.ok){message(res.errore||'Errore da Google Sheets.');return}const d=parseRemote(res);if(!await ask('Ripristinare da Google Sheets?',d.turni.length+' turni e '+d.programmati.length+' turni previsti'+(d.skipped?' ('+d.skipped+' righe illeggibili saltate)':'')+'. Sostituiranno quelli su questo telefono. Il turno in corso resta.','Ripristina'))return;const n=structuredClone(state);n.turni=d.turni;n.programmati=d.programmati;if(commitLocal(n,{recover:true})){meta.bloccato=null;meta.inAttesa=false;meta.errore='';meta.ultimaSync=new Date().toISOString();saveMeta();render();message('Dati ripristinati da Google Sheets.')}}
async function cloudConnect(button){const url=$('cUrl').value.trim(),codice=$('cCode').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){message('Indirizzo non valido: deve finire con /exec.');return}if(codice.length<8){message('Il codice segreto deve avere almeno 8 caratteri.');return}button.disabled=true;const prev={url:meta.url,codice:meta.codice};meta.url=url;meta.codice=codice;try{const res=await cloudFetch();if(!res.ok)throw Error(res.errore||'Errore da Google Sheets.');meta.errore='';meta.bloccato=null;saveMeta();const remote=(res.turni||[]).length+(res.previsti||[]).length,local=state.turni.length+state.programmati.length;message('Collegato a Google Sheets.');render();if(remote&&!local)await cloudRestore();else{changeSeq++;meta.inAttesa=true;await pushCloud(false,true)}}catch(e){meta.url=prev.url;meta.codice=prev.codice;saveMeta();message(e.message)}finally{button.disabled=false;render()}}
function renderSettings(){const b=meta.bloccato,lastB=meta.ultimoBackup?new Date(meta.ultimoBackup).toLocaleDateString('it-IT'):'mai';$('main').innerHTML='<h1>Impostazioni</h1><section class="card"><h2>Copia su Google Sheets</h2>'+(cloudOn()?'<p class="syncstatus">'+esc(syncText())+'</p><div id="blockedBox" class="notice"'+(b?'':' hidden')+'>'+(b?'Sul foglio ci sono '+b.foglio+' turni, su questo telefono '+b.qui+'. Per sicurezza non ho sovrascritto il foglio.':'')+'<div class="stack" style="margin-top:12px"><button data-action="restore">Ripristina da Google Sheets</button><button class="danger" data-action="forcePush">Sovrascrivi il foglio</button></div></div><div class="stack"><button data-action="syncNow">Copia adesso</button><button data-action="restore">Ripristina da Google Sheets</button><button class="link" data-action="disconnect">Scollega</button></div>':'<p class="muted">Ogni turno salvato viene copiato anche su un foglio Google. Se il telefono si perde o i dati vengono cancellati, si recupera tutto.</p><label>Indirizzo dello script<input id="cUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></label><label>Codice segreto<input id="cCode" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label><button class="primary" data-action="connect" style="width:100%">Collega e prova</button>')+'</section><section class="card"><h2>Backup manuale</h2><p class="muted">Ultimo backup: '+lastB+'. Il file si può salvare su File, Drive o inviare su WhatsApp.</p><div class="stack"><button data-action="backup">'+icon('download')+' Esporta backup</button><button data-action="import">Importa backup</button></div></section>'+examplesBanner()+'<section class="card"><h2>Riparti da zero</h2><p class="muted">Elimina anche il turno in corso. Sono richieste due conferme.</p><button class="danger" data-action="clear">Cancella tutti i dati</button></section><footer>'+(meta.persistente===true?'Archiviazione protetta dal browser attiva.':'Usa l’app dall’icona sulla schermata Home.')+'</footer>'}
window.addEventListener('online',()=>{if(cloudOn()&&meta.inAttesa&&!meta.bloccato){meta.errore='';pushCloud()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudOn()&&meta.inAttesa&&!meta.bloccato)pushCloud()});
setInterval(()=>{if(cloudOn()&&meta.inAttesa&&!meta.bloccato&&!syncing)pushCloud()},60000);
let planning=null;
function openPlanner(p=null,day=dateKey()){returnFocus=document.activeElement;planning=p?structuredClone(p):null;$('plannerTitle').textContent=p?'Modifica turno previsto':'Nuovo turno previsto';$('pDate').value=p?p.data:day;$('pStart').value=p?p.inizio:'09:00';$('pEnd').value=p?p.fine:'14:00';$('pRace').value=p?p.gara:'nessuna';$('pNotes').value=p?p.note:'';$('deletePlan').hidden=!p;$('pError').textContent='';planPreview();$('planner').showModal();$('closePlanner').focus()}
function readPlan(){const data=$('pDate').value,inizio=$('pStart').value.slice(0,5),fine=$('pEnd').value.slice(0,5);if(!data||!inizio||!fine)throw Error('Completa data e orari.');if(inizio===fine)throw Error('Inizio e fine non possono coincidere.');return checkPlan({id:planning?planning.id:uid(),data,inizio,fine,gara:$('pRace').value,note:$('pNotes').value.trim(),esempio:planning?.esempio===true})}
function planPreview(){try{const p=readPlan();$('pPreview').textContent=hours(planMs(p))+(toMin(p.fine)<=toMin(p.inizio)?' (finisce il giorno dopo)':'');$('pError').textContent=''}catch(e){$('pPreview').textContent='—'}}
$('planForm').addEventListener('input',planPreview);
$('planForm').onsubmit=e=>{e.preventDefault();try{const p=readPlan(),n=structuredClone(state);n.programmati=n.programmati.filter(t=>t.id!==p.id);n.programmati.push(p);if(commit(n)){$('planner').close();selectedDay=p.data;calMonth=p.data.slice(0,7);render();message('Turno aggiunto al calendario.')}}catch(err){$('pError').textContent=err.message}};
$('closePlanner').onclick=()=>$('planner').close();$('planner').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
$('deletePlan').onclick=async()=>{const target=planning;if(!target||!await ask('Eliminare il turno previsto?','Verrà tolto dal calendario.','Elimina'))return;const n=structuredClone(state);n.programmati=n.programmati.filter(p=>p.id!==target.id);if(commit(n)){$('planner').close();render();message('Turno previsto eliminato.')}};
$('settingsBtn').innerHTML=icon('settings');
loadMeta();try{navigator.storage?.persist?.().then(v=>{meta.persistente=v;saveMeta()}).catch(()=>{})}catch(e){}
$('brandIcon').innerHTML=icon('flag');load();if(cloudOn()&&meta.inAttesa&&!meta.bloccato)setTimeout(()=>pushCloud(),1000);render();setInterval(tick,1000);
</script>
</body>
